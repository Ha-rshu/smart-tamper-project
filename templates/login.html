<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Tamper Detection System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background: white;
            width: 380px;
            padding: 30px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .login-box img {
            width: 50px;
            margin-bottom: 10px;
        }

        h2 {
            margin: 10px 0;
            color: #0a2540;
        }

        p {
            font-size: 14px;
            color: #555;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #0a2540;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #133b6f;
        }

        .forgot {
            margin-top: 15px;
            font-size: 14px;
        }

        .forgot a {
            color: #0a2540;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <!-- Lock / Shield icon (optional image) -->
        <img src="https://cdn-icons-png.flaticon.com/512/3064/3064197.png" alt="Security Icon">

        <h2>SMART TAMPER DETECTION SYSTEM</h2>
        <p>Secure File Integrity Verification Platform</p>

        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <div class="forgot">
            <a href="#">Forgot Password?</a>
        </div>
    </div>

</body>
</html>
