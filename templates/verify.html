<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Verify File</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f4f7fb;
}

.navbar{
    background:#0a2540;
    color:white;
    padding:15px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.navbar a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

.card{
    width:520px;
    background:white;
    margin:70px auto;
    padding:30px;
    border-radius:14px;
    box-shadow:0 8px 25px rgba(0,0,0,0.12);
    text-align:center;
}

select,input{
    width:95%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:10px;
    margin-top:10px;
}

button{
    margin-top:15px;
    width:98%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#0a2540;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.msg{
    padding:10px;
    margin:10px 0;
    border-radius:10px;
    font-size:14px;
}
</style>
</head>

<body>

<div class="navbar">
    <div>Verify File</div>
    <a href="{{ url_for('dashboard') }}">Dashboard</a>
</div>

<div class="card">

<h2>Verify File</h2>

<form method="POST" enctype="multipart/form-data">

<select name="file_id" required>
{% for r in records %}
<option value="{{ r.id }}">{{ r.filename }}</option>
{% endfor %}
</select>

<input type="file" name="file" required>

<button type="submit">Verify</button>

</form>

</div>

</body>
</html>
